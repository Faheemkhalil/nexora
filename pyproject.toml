[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora"
version = "0.1.0"
description = "NEXORA — Personal AI Command & Security System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "NEXORA Development Team" }]

dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.19",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "keyring>=24.0",
    "loguru>=0.7",
    "httpx>=0.25",
    "tenacity>=8.0",
    "rich>=13.0",
    "pywebview>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
]

[project.scripts]
nexora = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
